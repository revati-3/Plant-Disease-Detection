<div class="container">

    <div class="login-card">
        
        <img src="https://cdn-icons-png.flaticon.com/512/2909/2909763.png" class="logo">

        <h2>Plant Disease Detection</h2>
        <p>Farmer Login</p>

        <form id="loginForm">

            <input type="text" placeholder="Farmer Name" required>
            <input type="text" placeholder="Farmer ID" required>

            <div class="password-box">
                <input type="password" id="password" placeholder="Password" required>
                <span onclick="togglePassword()">👁️</span>
            </div>

            <div class="options">
                <label><input type="checkbox"> Remember Me</label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>

        </form>

    </div>

</div>

<script src="Lscript.js"></script>
